# Windows release build.
#
# WHY THIS EXISTS: v0.2.0 shipped macOS-only because nothing here could produce
# a Windows artifact. PyInstaller does not cross-compile and Tauri's NSIS
# bundling requires Windows, so a macOS host cannot build one at all. The
# website's `lib/release.ts` derives BOTH platform download URLs from a single
# tag, so a macOS-only release leaves a broken Windows link.
#
# The rest of the repo was already Windows-ready before this file existed:
# `mapper-desktop.spec` has win32 branches (drops uvloop, adds the asyncio
# Windows event-loop backends), `main.rs` resolves `mapper-backend.exe` and
# tears down with `taskkill`, and `tauri.conf.json` already lists `nsis`.
name: Release (Windows)

on:
  push:
    tags: ["v*"]
  # Manual run. Two uses, told apart by the ref it is dispatched from:
  #   - dispatched FROM A TAG (Run workflow > "Use workflow from: Tags > v0.x.y"):
  #     retries a failed bundle for that tag and uploads to ITS release;
  #   - dispatched FROM A BRANCH: builds that branch and keeps the installer as
  #     a workflow artifact ONLY. It never touches a release.
  # The upload step enforces this (see its `if:`). A published release is
  # irreversible (Zenodo archives it), so no manual run on a branch may reach one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional. Leave EMPTY. Only meaningful if it equals the tag this run was dispatched from."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $t = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { "${{ github.ref_name }}" }
          "tag=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "building: $t (ref ${{ github.ref }})"
          if ("${{ github.ref }}" -like "refs/tags/*") {
            Write-Host "tag ref: the installer will be uploaded to the release for $t"
          } else {
            Write-Host "NOT a tag ref: the installer stays a workflow artifact; nothing is uploaded to any release"
          }
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}

      # Same cache shape as ci.yml: a cold Brightway2 + premise solve is by far
      # the slowest step, and the key is environment.yml so any dependency
      # change invalidates it.
      - name: Cache conda packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/conda_pkgs
          key: conda-${{ runner.os }}-${{ hashFiles('environment.yml') }}
          restore-keys: conda-${{ runner.os }}-

      - uses: conda-incubator/setup-miniconda@v4
        env:
          CONDA_PKGS_DIRS: ${{ runner.temp }}/conda_pkgs
        with:
          # Pinned: Miniforge 26.9.4-0 makes "conda init --all" fail on the Windows runner
          # ("needs sudo" on Scripts\conda.exe, exit code 1) while 26.7.2-1 passes on
          # the same image (windows-2025-vs2026 20261021.278.1). Unpin or bump later
          # once a newer release passes.
          miniforge-version: 26.7.2-1
          activate-environment: map
          environment-file: environment.yml
          auto-activate-base: false

      # The fast sparse solver. Without it the Windows build falls back to SuperLU
      # and ONE factorisation takes about 150 s (153.88 s measured on a Windows
      # laptop for a one-material, one-indicator LCA); with it, seconds. The same
      # steps as INSTALL.md "Quick Start (Windows)". environment.yml cannot list
      # it: conda-forge has only 0.4.2 for win-64 and its metadata carries the
      # numpy it was built against (numpy >=2.3.5) on top of the real ABI floor
      # (numpy >=1.23), which conflicts with the pinned numpy 1.26.4, so the
      # exact build is installed WITHOUT dependency resolution. Placed before
      # the pin check so that check also catches anything this install moved.
      - name: Install scikit-umfpack (pinned build, --no-deps) and SuiteSparse
        shell: pwsh
        run: |
          conda install -y -q -c conda-forge suitesparse
          if ($LASTEXITCODE -ne 0) { throw "conda install suitesparse failed ($LASTEXITCODE)" }
          conda install -y -q --no-deps https://conda.anaconda.org/conda-forge/win-64/scikit-umfpack-0.4.2-py311hb8cab9b_2.conda
          if ($LASTEXITCODE -ne 0) { throw "conda install scikit-umfpack failed ($LASTEXITCODE)" }
          conda list --no-pip | Select-String -Pattern "suitesparse|libumfpack|libcholmod|libamd|libcamd|libccolamd|libcolamd|libsuitesparseconfig|scikit-umfpack|^numpy |^scipy |libblas|liblapack"

      # A release artefact must be built against the pinned stack, and an
      # import check does NOT detect drift -- a drifted env imports everything
      # perfectly well. So compare the INSTALLED versions against the pins
      # parsed out of environment.yml, and fail the build on any mismatch.
      # Parsed rather than hard-coded so this cannot go stale when a pin moves.
      # A release artefact must be built against the pinned stack, and an
      # IMPORT CHECK DOES NOT DETECT DRIFT -- a drifted env imports everything
      # perfectly well. verify_pins.py parses the pins out of environment.yml
      # (rather than hard-coding them, so it cannot go stale) and fails the
      # build on any mismatch. It is a committed script rather than an inline
      # heredoc because PowerShell has no heredoc, and because a script can be
      # run locally before trusting it in CI.
      - name: Verify pinned versions match environment.yml
        shell: pwsh
        run: python scripts/verify_pins.py

      # (a) The solver loads and agrees with SciPy's SuperLU, through the same
      # code MApper runs (PersistentLCARunner) on a synthetic project in a
      # throwaway directory. Fails the build if _UMFPACK_OK is false.
      - name: Verify UMFPACK loads and solves identically (build environment)
        shell: pwsh
        run: python scripts/verify_umfpack.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mapper-frontend/package-lock.json

      # STEP 1 -- frontend, with the same-origin :8765 base baked in. Must run
      # BEFORE the freeze: the spec bundles dist/ into the sidecar.
      - name: Build frontend (desktop origin)
        shell: pwsh
        run: |
          cd mapper-frontend
          npm ci
          npm run build:desktop
          if (-not (Select-String -Path dist/assets/*.js -Pattern "localhost:8765" -Quiet)) {
            throw "SPA bundle does not contain localhost:8765"
          }
          Write-Host "port check: :8765 present in the SPA bundle"

      # STEP 2 -- clear stale bytecode, then freeze. Not paranoia: Python treats
      # a .pyc as fresh when the source's (mtime, size) match, and a version
      # bump like 0.2.0 -> 0.2.1 leaves the size IDENTICAL. A freeze that picks
      # up stale bytecode reports a version nothing in the tree contains.
      - name: Freeze backend (onedir)
        shell: pwsh
        run: |
          Get-ChildItem -Path mapper-backend -Filter __pycache__ -Recurse -Directory |
            Remove-Item -Recurse -Force
          cd mapper-backend
          pip install --quiet pyinstaller
          pyinstaller mapper-desktop.spec --noconfirm --clean
          if (-not (Test-Path dist/mapper-backend/mapper-backend.exe)) {
            throw "frozen sidecar mapper-backend.exe not produced"
          }
          Write-Host "sidecar built"

      # (b) The frozen folder carries the extension and every DLL it needs.
      - name: Verify the frozen sidecar bundles UMFPACK and its DLL closure
        shell: pwsh
        run: |
          pip install --quiet pefile
          python scripts/verify_frozen_umfpack.py mapper-backend/dist/mapper-backend

      # (c) Start the frozen sidecar the way the app does, on a spare port with
      # throwaway Brightway and log directories, and read its own startup line.
      # No project, no database, nothing of a user's is involved (a fresh runner).
      - name: Smoke-start the frozen sidecar and read "UMFPACK solver"
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "mapper-smoke"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$tmp\logs", "$tmp\bw" | Out-Null
          $env:MAPPER_PORT = "18765"
          $env:MAPPER_LOG_DIR = "$tmp\logs"
          $env:BRIGHTWAY2_DIR = "$tmp\bw"
          $exe = (Resolve-Path "mapper-backend/dist/mapper-backend/mapper-backend.exe").Path
          $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden `
                 -RedirectStandardOutput "$tmp\stdout.txt" -RedirectStandardError "$tmp\stderr.txt"
          try {
            $ok = $false
            for ($i = 0; $i -lt 90; $i++) {
              if ($p.HasExited) { break }
              try {
                $r = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/health" -TimeoutSec 3
                if ($r.status -eq "ok") { $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $ok) {
              Write-Host "---- stdout"; Get-Content "$tmp\stdout.txt" -ErrorAction SilentlyContinue | Select-Object -Last 40
              Write-Host "---- stderr"; Get-Content "$tmp\stderr.txt" -ErrorAction SilentlyContinue | Select-Object -Last 40
              throw "frozen sidecar did not answer /api/health on port 18765 (exited: $($p.HasExited))"
            }
            $log = Join-Path "$tmp\logs" "mapper.log"
            $line = $null
            for ($i = 0; $i -lt 15; $i++) {
              if (Test-Path $log) { $line = Select-String -Path $log -Pattern "UMFPACK solver:" | Select-Object -Last 1 }
              if ($line) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $line) { throw "no 'UMFPACK solver:' line in $log" }
            Write-Host $line.Line
            if ($line.Line -notmatch "UMFPACK solver: OK") { throw "frozen sidecar reports the slow fallback: $($line.Line)" }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      # STEP 3 -- stage the onedir where tauri.conf.json's bundle.resources
      # expects it. No symlink dereferencing needed here: that is a macOS
      # problem (conda ships ~53 versioned-dylib symlinks); Windows has none.
      - name: Stage sidecar as a Tauri resource
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force mapper-tauri/resources/mapper-backend -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path mapper-tauri/resources | Out-Null
          Copy-Item -Recurse mapper-backend/dist/mapper-backend mapper-tauri/resources/mapper-backend

      # The repo uses the standalone `tauri` CLI. The npm package ships
      # prebuilt platform binaries, so this is seconds rather than the several
      # minutes `cargo install tauri-cli` would spend compiling.
      - name: Install Tauri CLI
        shell: pwsh
        run: npm install -g "@tauri-apps/cli@^2"

      # STEP 4 -- bundle. Targets come from tauri.conf.json; only `nsis` is
      # produced on Windows (`app`/`dmg` are macOS-only and are skipped).
      - name: Build NSIS installer
        shell: pwsh
        run: |
          cd mapper-tauri
          tauri build --bundles nsis

      - name: Locate installer
        id: art
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path mapper-tauri/target -Recurse -Filter "*-setup.exe" |
                 Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "no NSIS installer found under mapper-tauri/target" }
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "installer : $($exe.FullName)"
          Write-Host "bytes     : $($exe.Length)"
          Write-Host "sha256    : $sha"
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($exe.Name)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The tag push and the release creation are separate events, so the
      # release may not exist yet when this job reaches here. Wait rather than
      # fail: the alternative is a green build with no uploaded asset.
      # GUARD: only a run on a tag ref uploads, and only to that same tag. A
      # manual run on a branch (or one whose optional `tag` input names another
      # tag) stops here and keeps the installer as the workflow artifact below.
      # Without this, a branch dispatch with tag=v0.4.0 would `--clobber` the
      # published v0.4.0 asset.
      - name: Upload to the release for this tag
        if: startsWith(github.ref, 'refs/tags/') && (github.event.inputs.tag == '' || github.event.inputs.tag == github.ref_name)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          for ($i = 0; $i -lt 30; $i++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "release $tag not published yet; waiting (attempt $($i+1)/30)"
            Start-Sleep -Seconds 20
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { throw "release $tag never appeared" }
          gh release upload $tag "${{ steps.art.outputs.path }}" --clobber
          Write-Host "uploaded ${{ steps.art.outputs.name }} to $tag"

      # Kept regardless of the upload, so a failed run still yields the binary.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mapper-windows-installer
          path: mapper-tauri/target/**/*-setup.exe
          if-no-files-found: warn
